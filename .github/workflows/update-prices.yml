name: Update live prices (Nifty + MCX Gold)

on:
  schedule:
    - cron: '*/15 * * * *'   # every ~15 minutes (GitHub may delay a bit under load)
  workflow_dispatch: {}       # lets us trigger it manually to test

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Nifty 50 (Yahoo Finance, delayed quote) and MCX Gold (Metals.Dev, needs secret)
        run: |
          set -e
          GEN_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # ---------- Nifty (Yahoo Finance chart API; no key needed, but
          # Yahoo itself labels this data "Delayed Quote", not real-time) ----------
          NIFTY_JSON="null"
          HTTP_CODE=$(curl -s -o /tmp/nifty.json -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            "https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI?interval=1d&range=1d" || echo "000")
          echo "Yahoo HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            NIFTY_JSON=$(jq -c '
              .chart.result[0].meta as $m |
              if $m == null then null else {
                price: $m.regularMarketPrice,
                dayHigh: $m.regularMarketDayHigh,
                dayLow: $m.regularMarketDayLow,
                prevClose: $m.chartPreviousClose,
                asOf: (if $m.regularMarketTime then ($m.regularMarketTime | strftime("%Y-%m-%dT%H:%M:%SZ")) else null end),
                source: "yahoo-delayed"
              } end
            ' /tmp/nifty.json 2>/dev/null || echo "null")
          fi
          echo "Nifty result: $NIFTY_JSON"

          # ---------- MCX Gold (Metals.Dev; needs METALS_DEV_API_KEY secret --
          # if the secret isn't set yet, this is skipped and mcx_gold stays null
          # so the app just shows "not set up yet" instead of breaking) ----------
          MCX_JSON="null"
          if [ -n "$METALS_KEY" ]; then
            HTTP_CODE2=$(curl -s -o /tmp/mcx.json -w "%{http_code}" \
              "https://api.metals.dev/v1/latest?api_key=${METALS_KEY}&currency=INR&unit=gram" || echo "000")
            echo "Metals.Dev HTTP status: $HTTP_CODE2"
            if [ "$HTTP_CODE2" = "200" ]; then
              echo "Metals.Dev raw response:"; cat /tmp/mcx.json
              # NOTE: exact response shape unconfirmed (no test key was available
              # while building this) -- tries a couple of likely field paths.
              # mcx_gold from Metals.Dev is priced per gram in the requested
              # currency; MCX itself quotes gold in INR per 10 grams, so *10.
              MCX_JSON=$(jq -c '
                (.metals.mcx_gold // .mcx_gold // .rates.mcx_gold) as $g |
                if $g == null then null else {
                  price: ($g * 10),
                  unit: "inr_per_10g",
                  source: "metals.dev"
                } end
              ' /tmp/mcx.json 2>/dev/null || echo "null")
            fi
          else
            echo "METALS_DEV_API_KEY secret not set yet -- skipping MCX fetch."
          fi
          echo "MCX result: $MCX_JSON"

          jq -n \
            --arg genAt "$GEN_AT" \
            --argjson nifty "$NIFTY_JSON" \
            --argjson mcx "$MCX_JSON" \
            '{generatedAt: $genAt, nifty: $nifty, mcx_gold: $mcx}' > live-prices.json

          cat live-prices.json
        env:
          METALS_KEY: ${{ secrets.METALS_DEV_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live-prices.json
          git diff --cached --quiet || git commit -m "Update live prices [skip ci]"
          git push
